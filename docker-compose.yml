version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: campus_load_balancer
    ports:
      - "80:80"
    depends_on:
      - backend_1
      - backend_2

  backend_1:
    build: .
    container_name: campus-platform-backend-1
    environment:
      - INSTANCE_ID=backend_1
      - DATABASE_URL=postgresql://campus_admin:campus_secure_password@postgres:5432/campus_platform
    depends_on:
      - postgres

  backend_2:
    build: .
    container_name: campus-platform-backend-2
    environment:
      - INSTANCE_ID=backend_2
      - DATABASE_URL=postgresql://campus_admin:campus_secure_password@postgres:5432/campus_platform
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: campus_db
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password
      POSTGRES_DB: campus_platform
