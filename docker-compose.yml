version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_db
    environment:
      POSTGRES_USER: campus_admin
      POSTGRES_PASSWORD: campus_secure_password
      POSTGRES_DB: campus_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u campus_admin -d campus_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: campus_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://campus_admin:campus_secure_password@postgres:5432/campus_platform
    depends_on:
      postgres:
        condition: service_healthy
